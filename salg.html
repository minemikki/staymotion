<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StayMotion — Salg</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f5f2;--ink:#151619;--muted:#6f7279;--line:#dbdcd8;--blue:#1248ff;--dark:#111216;--f:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:var(--f);color:var(--ink)}.app{height:100%;display:flex;flex-direction:column}.bar{height:68px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(245,245,242,.97);backdrop-filter:blur(16px)}.brand{font-size:13px;font-weight:800;letter-spacing:.16em;margin-right:12px}.tab{border:1px solid transparent;background:transparent;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;color:#5f6269;cursor:pointer}.tab:hover{background:#fff;border-color:var(--line);color:var(--ink)}.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}.count{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:999px;background:#e8e8e4;color:#62656c;font-size:11px;margin-left:5px}.tab.on .count{background:#ffffff22;color:#fff}.sp{flex:1}.note{font-size:12px;color:var(--muted)}.frame{width:100%;height:calc(100vh - 68px);border:0;display:block;background:var(--bg)}@media(max-width:640px){.bar{height:auto;min-height:68px;flex-wrap:wrap;padding:10px 12px}.brand{width:100%;margin:0}.note{display:none}.frame{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">STAYMOTION</div>
    <button class="tab on" id="research">Research <span class="count">22</span></button>
    <button class="tab" id="crm">CRM / Leads</button>
    <div class="sp"></div>
    <div class="note">Research først · CRM etter godkjenning</div>
  </div>
  <iframe id="frame" class="frame" src="/research.html" title="StayMotion salg"></iframe>
</div>
<script>
const frame=document.getElementById('frame');
const research=document.getElementById('research');
const crm=document.getElementById('crm');
function show(which){const isResearch=which==='research';research.classList.toggle('on',isResearch);crm.classList.toggle('on',!isResearch);frame.src=isResearch?'/research.html':'/salg-crm.html';}
research.onclick=()=>show('research');crm.onclick=()=>show('crm');
</script>
</body>
</html>
