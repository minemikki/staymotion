<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashbord — StayMotion</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--base:#0A0F14;--base2:#0E1620;--surface:#141D26;--surface2:#18232E;--ice:#EEF3F6;--dim:#C7D3DB;--muted:#8A9AA7;
    --cyan:#69D4E0;--cyan-deep:#3AA6B4;--champagne:#E7D2A9;--green:#63D08A;--red:#E9866F;--amber:#E7B872;
    --line:rgba(190,214,226,.12);--line2:rgba(190,214,226,.22);
    --f:"Inter Tight",-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--base);color:var(--ice);font-family:var(--f);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(1100px 500px at 80% -8%,rgba(105,212,224,.09),transparent 60%),radial-gradient(900px 460px at 5% -6%,rgba(231,210,169,.06),transparent 55%)}
  a{color:inherit}::selection{background:rgba(105,212,224,.28)}
  .wrap{max-width:1160px;margin:0 auto;padding:clamp(18px,3vw,36px) 20px 90px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{height:26px}.brand b{font-weight:700;font-size:13px;letter-spacing:.28em;padding-left:.28em}
  .brand b i{font-style:normal;color:var(--champagne)}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.015em}
  h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:8px;
    font-size:13px;font-weight:600;color:var(--dim);transition:border-color .2s,color .2s,background .2s,transform .1s}
  .btn:hover{border-color:var(--cyan);color:var(--ice)}.btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--champagne);color:#12100a;border-color:var(--champagne)}.btn.primary:hover{filter:brightness(1.05);color:#12100a}
  .btn.ghost{border-color:var(--line);color:var(--muted)}
  .btn.sm{min-height:32px;padding:0 11px;font-size:12px;border-radius:7px}

  /* gate */
  .gate{max-width:390px;margin:15vh auto 0;text-align:center}
  .gate .brand{justify-content:center;margin-bottom:22px}
  .gate h1{margin-bottom:8px}.gate p{color:var(--muted);margin-bottom:22px;font-size:14px}
  .gate input{width:100%;background:var(--surface);border:1px solid var(--line2);color:var(--ice);padding:14px 16px;border-radius:10px;margin-bottom:12px}
  .gate input:focus{outline:none;border-color:var(--cyan)}.gate .btn{width:100%;min-height:50px}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

  /* top bar + nav */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0 14px;background:transparent}
  .top .r{display:flex;align-items:center;gap:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(99,208,138,.16);display:inline-block}
  .nav{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 22px;border-bottom:1px solid var(--line);padding-bottom:14px}
  .nav .n{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
  .nav .n:hover{color:var(--ice);background:var(--surface)}
  .nav .n.active{background:var(--ice);color:#0c1116}
  .nav .n .ic{font-size:15px}

  /* stats grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 22px}
  .stat{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--base2));padding:16px 18px;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);opacity:.5}
  .stat.warn::before{background:var(--champagne)}.stat.ok::before{background:var(--green)}.stat.red::before{background:var(--red)}
  .stat .n{font-size:1.85rem;font-weight:800;line-height:1;font-feature-settings:"tnum" 1;letter-spacing:-.02em}
  .stat .l{color:var(--muted);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:7px;font-weight:600}
  .stat.warn .n{color:var(--champagne)}.stat.ok .n{color:var(--green)}.stat.red .n{color:var(--red)}
  .stat .k{position:absolute;right:12px;top:12px;font-size:15px;opacity:.35}
  .stat .d{font-size:11.5px;color:var(--muted);margin-top:4px}
  .stat .d.up{color:var(--green)}.stat .d.down{color:var(--red)}

  /* panels + charts */
  .panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--surface),var(--base2));padding:20px;margin-bottom:16px}
  .panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .panel .ph .t2{color:var(--muted);font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .chartbox{position:relative;height:260px}
  .chartbox.sm{height:230px}
  .chln{color:var(--muted);font-size:13px;text-align:center;padding:40px 0}

  /* controls */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .search{position:relative;flex:1;min-width:200px}
  .search input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ice);padding:10px 14px 10px 38px;border-radius:9px}
  .search input:focus{outline:none;border-color:var(--cyan)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  select{background:var(--surface);border:1px solid var(--line);color:var(--dim);padding:10px 14px;border-radius:9px;cursor:pointer}
  select:focus{outline:none;border-color:var(--cyan)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border-radius:100px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
  .tab .c{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;font-size:11px;border-radius:100px;background:rgba(190,214,226,.14);color:var(--dim)}
  .tab.active{background:var(--ice);color:#0c1116;border-color:var(--ice)}.tab.active .c{background:rgba(12,17,22,.16);color:#0c1116}

  /* order card */
  .order{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--base2));padding:20px;margin-bottom:14px;
    animation:rise .35s cubic-bezier(.22,.61,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .order::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--champagne);opacity:.55}
  .order.beh::before{background:var(--green)}.order.overdue::before{background:var(--red);opacity:1}
  .order.overdue{border-color:rgba(233,134,111,.4)}
  .oh{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .who b{font-size:1.18rem;font-weight:700;letter-spacing:-.01em}
  .who .em{display:inline-flex;align-items:center;gap:7px;margin-top:3px}
  .who a{color:var(--cyan);font-size:13.5px;text-decoration:none}.who a:hover{text-decoration:underline}
  .copy{opacity:.55;font-size:12px}.copy:hover{opacity:1;color:var(--cyan)}
  .rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:100px;white-space:nowrap}
  .badge.ubeh{background:rgba(231,210,169,.16);color:var(--champagne)}.badge.beh{background:rgba(99,208,138,.16);color:var(--green)}.badge.avv{background:rgba(138,154,167,.16);color:var(--muted)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid var(--line2);color:var(--dim)}
  .pill.exp{border-color:rgba(231,184,114,.4);color:var(--amber)}.pill.both{border-color:rgba(105,212,224,.4);color:var(--cyan)}
  .meta{display:flex;flex-wrap:wrap;gap:8px 26px;margin:15px 0 4px;color:var(--dim);font-size:13.5px}
  .meta .lab{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:1px}
  .meta b{color:var(--ice);font-weight:600}
  .cd{font-weight:700}.cd.over{color:var(--red)}.cd.soon{color:var(--amber)}.cd.ok{color:var(--green)}
  .msg{border-left:2px solid var(--cyan);padding:8px 0 8px 14px;color:var(--dim);font-size:13.5px;margin:14px 0 4px;white-space:pre-wrap;background:rgba(105,212,224,.04);border-radius:0 8px 8px 0}
  .msg .lab{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 9px}
  .phead .t{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .photos{display:flex;gap:8px;flex-wrap:wrap}
  .photos button{width:74px;height:74px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:#000;padding:0;transition:transform .15s,border-color .15s}
  .photos button:hover{transform:scale(1.05);border-color:var(--cyan)}
  .photos img{width:100%;height:100%;object-fit:cover;display:block}
  .none{color:var(--muted);font-size:13px;font-style:italic}
  .oa{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
  .photos button.morep{display:flex;align-items:center;justify-content:center;color:var(--cyan);font-weight:700;font-size:14px;background:rgba(105,212,224,.08)}
  .photos button.late{border-color:var(--amber)}
  .photos button.late::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--base2)}
  .photos button{position:relative}
  .latepill{font-size:10.5px;font-weight:600;color:var(--amber);background:rgba(231,184,114,.12);border:1px solid rgba(231,184,114,.35);padding:2px 8px;border-radius:100px;margin-left:8px}
  /* status segmented control */
  .statusctl{display:inline-flex;background:var(--base2);border:1px solid var(--line2);border-radius:100px;padding:3px;gap:2px}
  .sbtn{padding:7px 13px;border-radius:100px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s;border:0;background:transparent;cursor:pointer;font-family:inherit}
  .sbtn:hover{color:var(--ivory)}
  .sbtn.on{background:var(--ice);color:#0c1116}
  .slab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:10px;align-self:center}
  /* admin conversation */
  .conv{margin:16px 0 4px;border-top:1px solid var(--line);padding-top:14px}
  .conv .t{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:10px;display:block}
  .cbub{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;margin-bottom:8px}
  .cbub .w{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
  .cbub .tm{display:block;font-size:10px;color:var(--muted);margin-top:4px}
  .cbub.kunde{background:rgba(105,212,224,.07);border:1px solid rgba(105,212,224,.28);color:var(--ivory);border-bottom-left-radius:3px;margin-right:auto;align-self:flex-start}
  .cbub.oss{background:rgba(231,210,169,.08);border:1px solid rgba(231,210,169,.28);color:var(--ivory);border-bottom-right-radius:3px;margin-left:auto;align-self:flex-end}
  .reply{margin-top:12px}
  .reply textarea{width:100%;min-height:64px;background:var(--base2);border:1px solid var(--line2);border-radius:10px;color:var(--ivory);padding:11px 13px;font-family:inherit;font-size:13.5px;resize:vertical}
  .reply .ra{display:flex;align-items:center;gap:12px;margin-top:9px}
  .rstat{font-size:12.5px;color:var(--muted)}
  /* chat button on card */
  .claudebtn{border-color:rgba(105,212,224,.45);color:var(--cyan)}
  .claudebtn:hover{background:rgba(105,212,224,.1)}
  .claudebtn.on{background:var(--cyan);color:#0c1116;border-color:var(--cyan)}
  .btn.del{color:var(--muted);margin-left:auto}
  .btn.del:hover{color:var(--red);border-color:rgba(233,134,111,.5)}
  .chatbtn{position:relative}
  .chatbtn .cbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;font-size:11px;font-weight:700;border-radius:100px;background:rgba(190,214,226,.16);color:var(--dim)}
  .chatbtn.unread{border-color:var(--cyan);color:var(--cyan)}
  .chatbtn.unread .cbadge{background:var(--cyan);color:#0c1116}
  .chatbtn.unread::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 2px var(--base2);animation:cpulse 1.8s infinite}
  @keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(105,212,224,.5)}70%{box-shadow:0 0 0 7px rgba(105,212,224,0)}100%{box-shadow:0 0 0 0 rgba(105,212,224,0)}}
  /* chat popup */
  .chatwrap{position:fixed;inset:0;z-index:80;background:rgba(6,9,12,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:flex-end;padding:0}
  .chatpanel{display:flex;flex-direction:column;width:420px;max-width:100%;height:min(78vh,640px);margin:0 24px 24px 0;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden;animation:chatin .28s cubic-bezier(.22,.61,.36,1)}
  @keyframes chatin{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--base2),transparent)}
  .chathead .nm{font-weight:700;font-size:15px}
  .chathead .rf{color:var(--muted);font-size:12px;margin-top:1px}
  .chathead .x{font-size:20px;color:var(--muted);cursor:pointer;background:0;border:0;line-height:1;padding:4px 8px;border-radius:8px}
  .chathead .x:hover{color:var(--ivory);background:rgba(190,214,226,.08)}
  .chatmsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .chatmsgs .day{align-self:center;font-size:11px;color:var(--muted);margin:2px 0}
  .chatempty{margin:auto;text-align:center;color:var(--muted);font-size:13.5px;padding:20px}
  .chatfoot{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--base2)}
  .chatfoot textarea{flex:1;min-height:44px;max-height:140px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;color:var(--ivory);padding:11px 13px;font-family:inherit;font-size:14px;resize:none}
  .chatfoot .send{flex:none;background:var(--champagne);color:#12100a;border:0;border-radius:12px;font-weight:700;font-family:inherit;font-size:14px;padding:0 18px;height:44px;cursor:pointer}
  .chatfoot .send:disabled{opacity:.5;cursor:default}
  @media(max-width:640px){.chatwrap{align-items:stretch;justify-content:stretch}.chatpanel{width:100%;height:100%;margin:0;border-radius:0}}
  .empty{text-align:center;color:var(--muted);padding:70px 20px}.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}

  /* customers table */
  .ctable{width:100%;border-collapse:collapse;font-size:14px}
  .ctable th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
  .ctable td{padding:12px;border-bottom:1px solid var(--line)}
  .ctable tr:hover td{background:rgba(190,214,226,.03)}
  .ctable .nm{font-weight:700}.ctable .em{color:var(--cyan);font-size:13px}
  .ctable .sp{font-weight:700;text-align:right;font-feature-settings:"tnum" 1}
  .ctable .num{text-align:center;color:var(--dim)}
  @media(max-width:640px){.ctable .hidesm{display:none}}

  /* ---- CRM / Leads ---- */
  .lead-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .pipe{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pipe .p{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:100px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
  .pipe .p:hover{color:var(--ice)}
  .pipe .p.active{background:var(--ice);color:#0c1116;border-color:var(--ice)}
  .lead{position:relative;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,var(--surface),var(--base2));padding:16px 18px;margin-bottom:12px;animation:rise .3s cubic-bezier(.22,.61,.36,1) both}
  .lead::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--muted)}
  .lead.st-vunnet::before,.lead.st-retainer::before{background:var(--green)}
  .lead.st-tapt::before{background:var(--red)}
  .lead.st-kontaktet::before,.lead.st-svart::before{background:var(--cyan)}
  .lead.st-tilbud::before,.lead.st-demo_sendt::before,.lead.st-demo_tilbudt::before{background:var(--champagne)}
  .lead-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .lead-h .co{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
  .lead-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .lead-links{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:13px}
  .lead-links a{color:var(--cyan);text-decoration:none}
  .lead-links a:hover{text-decoration:underline}
  .score{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:8px 0}
  .score .bar{flex:1;max-width:130px;height:6px;border-radius:3px;background:rgba(190,214,226,.14);overflow:hidden}
  .score .bar i{display:block;height:100%;background:var(--cyan)}
  .seg-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
  .na{font-size:12.5px;color:var(--dim);margin-top:6px}
  .na.over{color:var(--red);font-weight:600}.na.today{color:var(--amber);font-weight:600}
  .lead-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  select.stagesel{background:var(--surface2);border:1px solid var(--line2);color:var(--ice);padding:7px 10px;border-radius:8px;font-size:12.5px;cursor:pointer}
  /* modal */
  .modal{position:fixed;inset:0;z-index:70;background:rgba(6,9,12,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:36px 16px}
  .modal .box{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:16px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.fgrid{grid-template-columns:1fr}}
  .f{display:flex;flex-direction:column;gap:5px}
  .f.full{grid-column:1/-1}
  .f label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .f input,.f select,.f textarea{background:var(--base2);border:1px solid var(--line2);color:var(--ice);padding:10px 12px;border-radius:8px;font:inherit}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--cyan)}
  .f textarea{min-height:70px;resize:vertical}
  .modal-actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}

  .spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:s 1s linear infinite;display:inline-block}
  @keyframes s{to{transform:rotate(360deg)}}
  .bell{position:relative}
  .bell.has{animation:bellring 1.6s ease-in-out infinite}
  @keyframes bellring{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(11deg)}80%{transform:rotate(-9deg)}90%{transform:rotate(5deg)}}
  .bell-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface,#0c1116)}
  .hide{display:none!important}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:60;background:rgba(6,9,12,.94);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .lb img{max-width:92vw;max-height:82vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .lb .x{position:absolute;top:18px;right:22px;font-size:26px;color:var(--ice);opacity:.7}.lb .x:hover{opacity:1}
  .lb .nav2{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:var(--ice);opacity:.55;padding:20px;user-select:none}.lb .nav2:hover{opacity:1}
  .lb .prev{left:6px}.lb .next{right:6px}
  .lb .cap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;color:var(--dim);font-size:13px}
  .lb .cap a{color:var(--cyan);text-decoration:none;border:1px solid var(--line2);padding:6px 12px;border-radius:8px}.lb .cap a:hover{border-color:var(--cyan)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line2);
    color:var(--ice);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:80;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.prod{margin:14px 0 4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
  .prod-h{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--cyan);margin:0 0 10px}
  .shot{padding:10px 0;border-top:1px dashed var(--line)}
  .shot:first-of-type{border-top:0;padding-top:0}
  .shot-h{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .shot-st{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:100px;border:1px solid var(--line)}
  .shot-st.ns{color:var(--muted)} .shot-st.gen{color:var(--amber);border-color:rgba(231,184,114,.4);background:rgba(231,184,114,.1)}
  .shot-st.gd{color:var(--cyan);border-color:rgba(105,212,224,.4);background:rgba(105,212,224,.1)}
  .shot-st.ap{color:#7ee08a;border-color:rgba(126,224,138,.4);background:rgba(126,224,138,.1)}
  .shot-st.rj{color:#e07e7e;border-color:rgba(224,126,126,.4);background:rgba(224,126,126,.1)}
  .takes{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
  .take{width:150px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
  .take.on{border-color:rgba(126,224,138,.5);box-shadow:0 0 0 1px rgba(126,224,138,.25)}
  .tk-h{font-size:11.5px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .tk-ap{color:#7ee08a;font-size:10px}
  .tk-v{width:100%;aspect-ratio:9/16;border-radius:7px;background:#000;display:block;object-fit:cover}
  .tk-a{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tk-a .btn{flex:1;min-width:0;text-align:center;text-decoration:none}
  .regen{margin-top:2px}
.finalb{margin:14px 0 4px;padding:14px;border:1px solid rgba(126,224,138,.28);border-radius:12px;background:rgba(126,224,138,.04)}
  .fin-empty{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
  .fin-v{width:210px;max-width:60%;aspect-ratio:9/16;border-radius:9px;background:#000;display:block;object-fit:cover;margin-bottom:10px}
  .fin-meta{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 12px}
  .fin-meta span{display:flex;flex-direction:column;gap:2px}
  .fin-meta .lab{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .fin-meta b{font-size:12.5px}
  .fin-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .fin-a .btn{text-decoration:none}
  .fin-ok{color:#7ee08a;font-weight:600;font-size:13px}
  .revs{margin:0 0 12px;padding:10px 12px;border:1px solid rgba(224,126,126,.35);background:rgba(224,126,126,.07);border-radius:9px}
  .rev-h{font-size:11.5px;font-weight:700;color:#e07e7e;margin-bottom:6px}
  .rev{font-size:12.5px;margin:3px 0}
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate" class="gate">
  <div class="brand"><img src="img/logo-mono.png" alt=""><b>STAY<i>MOTION</i></b></div>
  <h1>Dashbord</h1>
  <p>Skriv inn admin-passordet.</p>
  <input id="key" type="password" placeholder="Passord" autocomplete="current-password">
  <button class="btn primary" id="enter">Logg inn</button>
  <div class="err" id="gerr"></div>
</div>

<!-- Dashboard -->
<div id="dash" class="wrap hide">
  <div class="top">
    <div class="brand"><img src="img/logo-mono.png" alt=""><b>STAY<i>MOTION</i></b></div>
    <div class="r">
      <span class="sub"><span class="dot"></span> <span id="updated"></span></span>
      <button class="btn bell" id="bell" title="Nye bestillinger" aria-label="Nye bestillinger">🔔<span class="bell-badge hide" id="bellBadge">0</span></button>
      <button class="btn" id="refresh">↻ Oppdater</button>
      <button class="btn ghost" id="logout">Logg ut</button>
    </div>
  </div>

  <div class="nav" id="nav">
    <button class="n active" data-v="oversikt"><span class="ic">◈</span> Oversikt</button>
    <button class="n" data-v="bestillinger"><span class="ic">▤</span> Bestillinger</button>
    <button class="n" data-v="statistikk"><span class="ic">📈</span> Statistikk</button>
    <button class="n" data-v="kunder"><span class="ic">☺</span> Kunder</button>
    <button class="n" data-v="leads"><span class="ic">◎</span> Leads</button>
  </div>

  <!-- OVERSIKT -->
  <section id="v-oversikt">
    <div class="stats" id="ov-stats"></div>
    <div class="panel">
      <div class="ph"><h2>Omsetning siste 30 dager</h2><span class="t2" id="ov-revsum"></span></div>
      <div class="chartbox"><canvas id="ch-ov"></canvas><div class="chln hide" id="ln-ov"></div></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>Siste bestillinger</h2><button class="btn sm ghost" data-goto="bestillinger">Se alle →</button></div>
      <div id="ov-recent"></div>
    </div>
  </section>

  <!-- BESTILLINGER -->
  <section id="v-bestillinger" class="hide">
    <div class="controls">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Søk navn, e-post, pakke …" autocomplete="off">
      </label>
      <select id="sort">
        <option value="ny">Nyeste først</option>
        <option value="frist">Frist snarest</option>
        <option value="belop">Høyest beløp</option>
      </select>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-f="nye">Nye<span class="c" id="c-nye">0</span></button>
      <button class="tab" data-f="ubehandlet">Ubehandlet<span class="c" id="c-ubeh">0</span></button>
      <button class="tab" data-f="behandlet">Behandlet<span class="c" id="c-beh">0</span></button>
      <button class="tab" data-f="alle">Alle<span class="c" id="c-all">0</span></button>
      <button class="tab" data-f="avventer">Påbegynt<span class="c" id="c-avv">0</span></button>
    </div>
    <div id="list"></div>
  </section>

  <!-- STATISTIKK -->
  <section id="v-statistikk" class="hide">
    <div class="stats" id="st-stats"></div>
    <div class="panel">
      <div class="ph"><h2>Omsetning per dag</h2><span class="t2">Siste 30 dager</span></div>
      <div class="chartbox"><canvas id="ch-rev"></canvas><div class="chln hide" id="ln-rev"></div></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>Bestillinger per uke</h2><span class="t2">Siste 8 uker</span></div>
      <div class="chartbox"><canvas id="ch-week"></canvas><div class="chln hide" id="ln-week"></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="ph"><h2>Fordeling per pakke</h2></div><div class="chartbox sm"><canvas id="ch-pkg"></canvas><div class="chln hide" id="ln-pkg"></div></div></div>
      <div class="panel"><div class="ph"><h2>Fordeling format</h2></div><div class="chartbox sm"><canvas id="ch-fmt"></canvas><div class="chln hide" id="ln-fmt"></div></div></div>
    </div>
  </section>

  <!-- KUNDER -->
  <section id="v-kunder" class="hide">
    <div class="controls">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cq" type="search" placeholder="Søk kunde …" autocomplete="off">
      </label>
    </div>
    <div class="panel" style="padding:8px 10px"><div style="overflow-x:auto"><table class="ctable" id="ctable"></table></div></div>
  </section>

  <!-- LEADS / CRM -->
  <section id="v-leads" class="hide">
    <div class="stats" id="lead-stats"></div>
    <div class="pipe" id="lead-pipe"></div>
    <div class="lead-toolbar">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="lq" type="search" placeholder="Søk selskap, kontakt, e-post …" autocomplete="off">
      </label>
      <select id="lseg">
        <option value="">Alle segmenter</option>
        <option value="hotell">Hotell</option>
        <option value="hytte">Hytte/Airbnb</option>
        <option value="megler">Eiendomsmegler</option>
        <option value="property">Property manager</option>
        <option value="restaurant">Restaurant</option>
        <option value="partner">Partner</option>
        <option value="annet">Annet</option>
      </select>
      <select id="lsort">
        <option value="score">Høyest score</option>
        <option value="na">Neste handling</option>
        <option value="recent">Sist endret</option>
      </select>
      <button class="btn primary" id="lead-add">+ Ny lead</button>
      <button class="btn ghost" id="lead-import">Importer</button>
    </div>
    <div id="lead-list"></div>
  </section>
</div>

<div id="toast" class="toast"></div>

<div id="chat" class="chatwrap hide">
  <div class="chatpanel">
    <div class="chathead">
      <div><div class="nm" id="chatName">Kunde</div><div class="rf" id="chatRef"></div></div>
      <button class="x" id="chatClose" title="Lukk">✕</button>
    </div>
    <div class="chatmsgs" id="chatMsgs"></div>
    <div class="chatfoot">
      <textarea id="chatInput" placeholder="Skriv en melding til kunden …" rows="1"></textarea>
      <button class="send" id="chatSend">Send</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  var KEY='', ORDERS=[], VIEW='oversikt', FILTER='nye', SORT='ny', Q='', CQ='', SEEN=0, LASTSIG='';
  var $=function(id){return document.getElementById(id);};
  var C={cyan:'#69D4E0',champagne:'#E7D2A9',green:'#63D08A',amber:'#E7B872',red:'#E9866F',muted:'#8A9AA7',dim:'#C7D3DB',line:'rgba(190,214,226,.12)'};
  var charts={};

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function kr(n){return n!=null?Number(n).toLocaleString('no-NO')+' kr':'—';}
  function fmtDate(ts){return ts?new Date(ts).toLocaleString('no-NO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
  function ago(ts){if(!ts)return'';var s=(Date.now()-ts)/1000;if(s<60)return'nå nettopp';if(s<3600)return Math.floor(s/60)+' min siden';if(s<86400)return Math.floor(s/3600)+' t siden';return Math.floor(s/86400)+' d siden';}
  function countdown(ts){if(!ts)return{t:'—',c:''};var d=ts-Date.now();var over=d<0;var a=Math.abs(d);var h=Math.floor(a/3600000),m=Math.floor((a%3600000)/60000);var days=Math.floor(h/24);var txt=days>=1?(days+'d '+(h%24)+'t'):(h+'t '+m+'m');if(over)return{t:'Over frist · '+txt,c:'over'};if(d<6*3600000)return{t:txt+' igjen',c:'soon'};return{t:txt+' igjen',c:'ok'};}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on');},1900);}
  function statusOf(o){return o.status||'ubehandlet';}
  // A real order is one Stripe confirmed as paid (durable flag). Everything
  // else — carts started but never paid — is "Påbegynt", kept separate.
  function paid(o){return !!(o.paid||o.paidAt);}
  // Merge our replies + the customer's notes into one time-ordered thread.
  function threadOf(o){
    return [].concat((o.replies||[]).map(function(m){return {at:m.at||0,text:m.text||'',who:'oss'};}))
             .concat((o.notes||[]).map(function(m){return {at:m.at||0,text:m.text||'',who:'kunde'};}))
             .sort(function(a,b){return (a.at||0)-(b.at||0);});
  }

  function ordersSig(list){return list.map(function(o){return o.id+':'+(o.status||'')+':'+(o.paid?1:0)+':'+(o.videoRequested?1:0)+':'+((o.photos&&o.photos.length)||0)+':'+((o.notes&&o.notes.length)||0)+':'+((o.replies&&o.replies.length)||0);}).join('|');}
  async function load(auto){
    try{
      var r=await fetch('/api/admin-orders?key='+encodeURIComponent(KEY));
      if(r.status===401){logout('Feil passord.');return;}
      var d=await r.json();var incoming=d.orders||[];
      $('updated').textContent='Oppdatert '+new Date().toLocaleTimeString('no-NO');
      var sig=ordersSig(incoming);
      // Background refresh: if nothing changed, skip the heavy re-render/relayout
      // so the page stays smooth instead of rebuilding every card + thumbnail.
      if(auto && sig===LASTSIG) return;
      LASTSIG=sig; ORDERS=incoming;
      // Capture the "seen" watermark from last visit BEFORE rendering, so the
      // "Nye"-tab can show real orders that arrived since then.
      try{ SEEN=parseInt(localStorage.getItem('sm_seen')||'0',10)||0; }catch(e){ SEEN=0; }
      renderAll();
      // toast once for genuinely new paid orders, then advance the watermark
      try{
        var mm=metrics(); var nNew=mm.nye.length;
        if(nNew>0 && SEEN>0) toast(nNew===1?'Ny bestilling! 🔔':nNew+' nye bestillinger! 🔔');
        var newest=mm.paidO.reduce(function(a,o){return Math.max(a,o.created||0);},0);
        if(newest>SEEN) try{localStorage.setItem('sm_seen',String(newest));}catch(e){}
      }catch(e){}
    }catch(e){ $('list').innerHTML='<div class="empty"><div class="big">⚠</div>Kunne ikke hente bestillinger.</div>'; }
  }

  function updateBell(){
    var m=metrics(), n=m.nye.length, badge=$('bellBadge'), bell=$('bell');
    if(!badge||!bell)return;
    if(n>0){badge.textContent=n;badge.classList.remove('hide');}else{badge.classList.add('hide');}
    bell.classList.toggle('has', n>0);
  }

  function renderAll(){ renderOversikt(); renderBestillinger(); renderStatistikk(); renderKunder(); updateBell(); if(CHAT_ID&&!$('chat').classList.contains('hide'))renderChat(); }

  /* ---------- shared stat cards ---------- */
  function metrics(){
    var now=Date.now();
    var ubeh=ORDERS.filter(function(o){return paid(o)&&statusOf(o)!=='behandlet';});
    var beh=ORDERS.filter(function(o){return paid(o)&&statusOf(o)==='behandlet';});
    var overdue=ubeh.filter(function(o){return o.deadline&&o.deadline<now;});
    var paidO=ORDERS.filter(paid);
    var rev=paidO.reduce(function(a,o){return a+(o.amountKr||0);},0);
    var mStart=new Date();mStart.setDate(1);mStart.setHours(0,0,0,0);
    var revM=paidO.filter(function(o){return o.created&&o.created>=mStart.getTime();}).reduce(function(a,o){return a+(o.amountKr||0);},0);
    var avg=paidO.length?Math.round(rev/paidO.length):0;
    var avv=ORDERS.filter(function(o){return !paid(o);});
    // Nye = real orders that arrived since the last admin visit, still unhandled.
    var nye=ORDERS.filter(function(o){return paid(o)&&statusOf(o)!=='behandlet'&&(o.created||0)>SEEN;});
    return {ubeh:ubeh,beh:beh,overdue:overdue,paidO:paidO,rev:rev,revM:revM,avg:avg,avv:avv,nye:nye};
  }

  /* ---------- OVERSIKT ---------- */
  function renderOversikt(){
    var m=metrics();
    $('ov-stats').innerHTML=
      '<div class="stat warn"><span class="k">◔</span><div class="n">'+m.ubeh.length+'</div><div class="l">Ubehandlet</div></div>'+
      '<div class="stat red"><span class="k">⚠</span><div class="n">'+m.overdue.length+'</div><div class="l">Over frist</div></div>'+
      '<div class="stat"><span class="k">◆</span><div class="n">'+kr(m.revM)+'</div><div class="l">Omsetning i mnd</div></div>'+
      '<div class="stat ok"><span class="k">∑</span><div class="n">'+kr(m.rev)+'</div><div class="l">Omsetning totalt</div></div>'+
      '<div class="stat"><span class="k">⌀</span><div class="n">'+kr(m.avg)+'</div><div class="l">Snitt per ordre</div></div>';
    // recent 5
    var recent=ORDERS.filter(paid).slice().sort(function(a,b){return (b.created||0)-(a.created||0);}).slice(0,5);
    $('ov-recent').innerHTML=recent.length?recent.map(orderCard).join(''):'<div class="empty"><div class="big">✧</div>Ingen bestillinger ennå.</div>';
    wireList($('ov-recent'));
    // chart
    var days=dayBuckets(30);
    var sum=days.reduce(function(a,d){return a+d.rev;},0);
    $('ov-revsum').textContent=kr(sum)+' totalt';
    lineChart('ch-ov','ln-ov',days.map(function(d){return d.label;}),days.map(function(d){return d.rev;}),'Omsetning');
  }

  /* ---------- BESTILLINGER ---------- */
  var MAXTHUMB=8;
  function orderCard(o){
    var now=Date.now();var s=statusOf(o);var isPaid=paid(o);var id=esc(o.id);
    var over=isPaid&&s!=='behandlet'&&(!(o.deliverables&&o.deliverables.length))&&o.deadline&&o.deadline<now;
    var badge=!isPaid?'<span class="badge avv">Påbegynt</span>':(s==='behandlet'?'<span class="badge beh">Ferdig</span>':s==='under_arbeid'?'<span class="badge ubeh" style="background:rgba(105,212,224,.16);color:var(--cyan)">Under arbeid</span>':'<span class="badge ubeh">Ubehandlet</span>');
    var pills=(o.express?'<span class="pill exp">Express</span>':'')+(o.both?'<span class="pill both">Begge formater</span>':'');
    var cd=countdown(o.deadline);
    // photos: cap thumbnails for performance; flag ones sent after the order was placed
    var plist=o.photos||[]; var lateCut=(o.created||0)+120000;
    var lateCount=plist.filter(function(p){return p.uploadedAt&&p.uploadedAt>lateCut;}).length;
    var shown=plist.slice(0,MAXTHUMB); var extra=plist.length-shown.length;
    var photos=plist.length?(shown.map(function(p,pi){
        var late=p.uploadedAt&&p.uploadedAt>lateCut;
        return '<button class="'+(late?'late':'')+'" data-oid="'+id+'" data-pi="'+pi+'"><img src="'+esc(p.url)+'" alt="" loading="lazy" decoding="async" width="74" height="74"></button>';
      }).join('')+(extra>0?'<button class="morep" data-oid="'+id+'" data-pi="'+MAXTHUMB+'">+'+extra+'</button>':''))
      :'<span class="none">Ingen bilder lastet opp ennå</span>';
    var dlAll=plist.length?'<button class="btn sm ghost" data-dl="'+id+'">⤓ Last ned alle ('+plist.length+')</button>':'';
    // conversation summary for the card's chat button
    var thread=threadOf(o);
    var lastKunde=thread.length&&thread[thread.length-1].who==='kunde';
    var chatBtn=isPaid?('<button class="btn ghost chatbtn'+(lastKunde?' unread':'')+'" data-chat="'+id+'">💬 Snakk med kunde'+(thread.length?' <span class="cbadge">'+thread.length+'</span>':'')+'</button>'):'';
    var statusCtl=isPaid?('<span class="slab">Status kunden ser</span><div class="statusctl">'+
        '<button class="sbtn'+(s!=='under_arbeid'&&s!=='behandlet'?' on':'')+'" data-id="'+id+'" data-s="ubehandlet">I kø</button>'+
        '<button class="sbtn'+(s==='under_arbeid'?' on':'')+'" data-id="'+id+'" data-s="under_arbeid">Under arbeid</button>'+
        '<button class="sbtn'+(s==='behandlet'?' on':'')+'" data-id="'+id+'" data-s="behandlet">Ferdig</button>'+
      '</div>'):'<button class="btn primary" data-paid="'+id+'">✓ Bekreft betalt</button>';
    var prod=prodBlock(o,id);

  function dayBuckets(n){
    var out=[];var d=new Date();d.setHours(0,0,0,0);
    var map={};ORDERS.filter(paid).forEach(function(o){if(!o.created)return;var k=new Date(o.created);k.setHours(0,0,0,0);var key=k.getTime();if(!map[key])map[key]={rev:0,count:0};map[key].rev+=(o.amountKr||0);map[key].count++;});
    for(var i=n-1;i>=0;i--){var day=new Date(d);day.setDate(d.getDate()-i);var key=day.getTime();var e=map[key]||{rev:0,count:0};out.push({label:day.toLocaleDateString('no-NO',{day:'2-digit',month:'2-digit'}),rev:e.rev,count:e.count});}
    return out;
  }
  function weekBuckets(n){
    var out=[];var now=new Date();now.setHours(0,0,0,0);var monday=new Date(now);var wd=(now.getDay()+6)%7;monday.setDate(now.getDate()-wd);
    for(var i=n-1;i>=0;i--){var start=new Date(monday);start.setDate(monday.getDate()-i*7);var end=new Date(start);end.setDate(start.getDate()+7);
      var c=ORDERS.filter(paid).filter(function(o){return o.created&&o.created>=start.getTime()&&o.created<end.getTime();}).length;
      out.push({label:'u.'+isoWeek(start),count:c});}
    return out;
  }
  function isoWeek(d){var t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));var w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);}

  function noChart(){return typeof Chart==='undefined';}
  function baseOpts(){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},

  function lineChart(cid,lid,labels,data,label){
    if(noChart()){$(lid).classList.remove('hide');$(lid).textContent='Grafer kunne ikke lastes.';return;}
    var cv=$(cid);if(charts[cid])charts[cid].destroy();
    var ctx=cv.getContext('2d');var g=ctx.createLinearGradient(0,0,0,240);g.addColorStop(0,'rgba(105,212,224,.35)');g.addColorStop(1,'rgba(105,212,224,0)');
    charts[cid]=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{label:label,data:data,borderColor:C.cyan,backgroundColor:g,fill:true,tension:.35,borderWidth:2,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:C.cyan}]},
      options:Object.assign(baseOpts(),{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return kr(c.parsed.y);}}}}})});
  }
  function barChart(cid,lid,labels,data,label){
    if(noChart()){$(lid).classList.remove('hide');$(lid).textContent='Grafer kunne ikke lastes.';return;}
    var cv=$(cid);if(charts[cid])charts[cid].destroy();
    charts[cid]=new Chart(cv.getContext('2d'),{type:'bar',data:{labels:labels,datasets:[{label:label,data:data,backgroundColor:'rgba(231,210,169,.55)',hoverBackgroundColor:C.champagne,borderRadius:6,maxBarThickness:34}]},options:baseOpts()});
  }
  function donut(cid,lid,labels,data){
    if(noChart()){$(lid).classList.remove('hide');$(lid).textContent='Grafer kunne ikke lastes.';return;}
    var cv=$(cid);if(charts[cid])charts[cid].destroy();
    if(!data.length||data.reduce(function(a,b){return a+b;},0)===0){$(lid).classList.remove('hide');$(lid).textContent='Ingen data ennå.';cv.classList.add('hide');return;}
    cv.classList.remove('hide');$(lid).classList.add('hide');
    var cols=[C.cyan,C.champagne,C.green,C.amber,C.red,'#9aa9b5'];
    charts[cid]=new Chart(cv.getContext('2d'),{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:cols,borderColor:'#0E1620',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:C.dim,padding:14,font:{size:12}}}}}});
  }

  var STAGES=[['sourced','Ny'],['kvalifisert','Kvalifisert'],['kontaktet','Kontaktet'],['svart','Svart'],['demo_tilbudt','Demo tilbudt'],['demo_sendt','Demo sendt'],['tilbud','Tilbud gitt'],['vunnet','Vunnet'],['retainer','Retainer'],['tapt','Tapt']];

  function segLabel(s){var f=SEGMENTS.filter(function(x){return x[0]===s;})[0];return f?f[1]:(s||'—');}

  async function loadLeads(){

  function renderLeads(){
    if(leadModalOpen) return;
    var open=LEADS.filter(function(l){return OPEN_STAGES.indexOf(l.stage||'sourced')>=0;});
    var won=LEADS.filter(function(l){return l.stage==='vunnet'||l.stage==='retainer';});
    var pipeVal=open.reduce(function(a,l){return a+(Number(l.quotedPrice)||0);},0);
    var avg=LEADS.length?Math.round(LEADS.reduce(function(a,l){return a+(Number(l.leadScore)||0);},0)/LEADS.length):0;

      '<div class="stat"><span class="k">☆</span><div class="n">'+avg+'</div><div class="l">Snitt score</div></div>';
    var counts={}; LEADS.forEach(function(l){var s=l.stage||'sourced';counts[s]=(counts[s]||0)+1;});
    $('lead-pipe').innerHTML='<span class="p'+(LFILTER_STAGE===''?' active':'')+'" data-stage="">Alle <b>'+LEADS.length+'</b></span>'+
      STAGES.map(function(s){return '<span class="p'+(LFILTER_STAGE===s[0]?' active':'')+'" data-stage="'+s[0]+'">'+s[1]+' <b>'+(counts[s[0]]||0)+'</b></span>';}).join('');

    var rows=LEADS.filter(function(l){
      if(LFILTER_STAGE && (l.stage||'sourced')!==LFILTER_STAGE) return false;
      if(LSEG && (l.segment||'')!==LSEG) return false;
      if(LQ){var hay=((l.company||'')+' '+(l.contact||'')+' '+(l.email||'')+' '+(l.location||'')).toLowerCase();if(hay.indexOf(LQ)<0)return false;}
      return true;
    });
    rows.sort(function(a,b){
      if(LSORT==='na'){var an=naTime(a)||9e15,bn=naTime(b)||9e15;return an-bn;}

      return (Number(b.leadScore)||0)-(Number(a.leadScore)||0);

  }

  async function putLead(lead){
    try{

      var d=await r.json();
      if(d.lead){ var i=LEADS.map(function(x){return x.id;}).indexOf(d.lead.id); if(i>=0)LEADS[i]=d.lead; else LEADS.unshift(d.lead); }
      return d.lead;
    }catch(e){ toast('Kunne ikke lagre'); }
  }

      var err=$('sm-err');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ err.textContent='Fyll inn en gyldig mottaker-e-post.'; err.style.display='block'; return; }
      if(!sub||!body){ err.textContent='Emne og melding må fylles ut.'; err.style.display='block'; return; }
      $('sm-send').disabled=true; $('sm-send').textContent='Sender …'; err.style.display='none';
      try{
        var r=await fetch('/api/send-lead-email?key='+encodeURIComponent(KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:to,subject:sub,body:body})});
        var d=await r.json();
        if(!r.ok||!d.ok) throw new Error(d.error||('HTTP '+r.status));
        l.email=to;
        if((l.stage||'sourced')==='sourced'||l.stage==='kvalifisert') l.stage='kontaktet';
        l.lastResponse='E-post sendt '+new Date().toLocaleDateString('no-NO');
        l.nextAction='Følg opp';
        var d3=new Date(); d3.setDate(d3.getDate()+3); l.nextActionDate=d3.toISOString().slice(0,10);
        await putLead(l);
        closeLeadModal(); toast('E-post sendt ✓'); renderLeads();
      }catch(e){ $('sm-send').disabled=false; $('sm-send').textContent='✉ Send e-post'; err.textContent='Kunne ikke sende: '+(e.message||e); err.style.display='block'; }
    };
  }

  function openImport(){
    leadModalOpen=true;
    var el=document.createElement('div'); el.className='modal'; el.id='leadModal';
    el.innerHTML='<div class="box"><h3>Importer leads</h3>'+
      '<p class="lead-sub" style="margin-bottom:10px">Lim inn én lead per linje. Felt skilt med komma eller tab, i denne rekkefølgen:<br><b>Selskap, Segment, Sted, Kontakt, E-post, Telefon, Instagram, Nettside, Score</b><br>Segment: hotell / hytte / megler / property / restaurant / partner / annet</p>'+
      '<div class="f full"><textarea id="imp" style="min-height:170px" placeholder="Hytte AS, hytte, Ryfylke, Kari, post@hytte.no, 40000000, @hytteas, hytte.no, 75"></textarea></div>'+
      '<div class="modal-actions"><button class="btn ghost" id="lf-cancel">Avbryt</button><button class="btn primary" id="imp-save">Importer</button></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click',function(e){if(e.target===el)closeLeadModal();});
    $('lf-cancel').onclick=closeLeadModal;
    $('imp-save').onclick=async function(){
      var lines=($('imp').value||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(!lines.length){closeLeadModal();return;}
      $('imp-save').disabled=true; $('imp-save').textContent='…';
      var keys=['company','segment','location','contact','email','phone','instagram','website','leadScore'];
      var n=0;
      for(var i=0;i<lines.length;i++){
        var parts=lines[i].split(/\t|,/).map(function(x){return x.trim();});
        var lead={stage:'sourced'};
        keys.forEach(function(k,idx){ if(parts[idx]!=null&&parts[idx]!=='') lead[k]=parts[idx]; });
        if(lead.leadScore!=null) lead.leadScore=Number(lead.leadScore)||0;
        if(lead.company){ await putLead(lead); n++; }
      }
      closeLeadModal(); toast('Importerte '+n+' leads'); renderLeads();
    };
  }

  $('lq').addEventListener('input',function(){LQ=this.value.trim().toLowerCase();renderLeads();});
  $('lseg').addEventListener('change',function(){LSEG=this.value;renderLeads();});
  $('lsort').addEventListener('change',function(){LSORT=this.value;renderLeads();});
  $('lead-add').onclick=function(){openLeadModal(null);};
  $('lead-import').onclick=openImport;
  /* =============== END CRM / LEADS =============== */

  setInterval(function(){[].forEach.call(document.querySelectorAll('.cd[data-deadline]'),function(el){var ts=+el.getAttribute('data-deadline');if(!ts)return;var cd=countdown(ts);el.textContent=cd.t;el.className='cd '+cd.c;});},30000);
  // General background refresh (cheap: skips re-render when nothing changed).
  setInterval(function(){if(!$('dash').classList.contains('hide')&&!document.hidden)load(true);},12000);
  // Near-live refresh while a chat is open, so a customer's reply lands within seconds.
  setInterval(function(){if(!document.hidden&&CHAT_ID&&!$('chat').classList.contains('hide'))load(true);},3500);

  function enter(){KEY=$('key').value.trim();if(!KEY){$('gerr').textContent='Skriv inn passord.';return;}try{sessionStorage.setItem('sm_admin',KEY);}catch(e){}$('gate').classList.add('hide');$('dash').classList.remove('hide');load();}
  function logout(msg){try{sessionStorage.removeItem('sm_admin');}catch(e){}KEY=''; $('dash').classList.add('hide');$('gate').classList.remove('hide');$('gerr').textContent=msg||'';$('key').value='';}
  $('enter').onclick=enter;$('key').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
  (function(){var k;try{k=sessionStorage.getItem('sm_admin');}catch(e){}if(k){$('key').value=k;enter();}})();
</script>
</body>
</html>
