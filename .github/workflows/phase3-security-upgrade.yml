name: Phase 3 one-time Next.js security upgrade

on:
  push:
    branches:
      - 'gpt/phase3-real-pilot-hardening'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/phase3-real-pilot-hardening
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pilot/package-lock.json
      - name: Upgrade Next.js maintenance-LTS security release
        working-directory: pilot
        run: npm install next@15.5.24 --save-exact
      - name: Verify package
        working-directory: pilot
        run: |
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_PUBLIC_STAYMOTION_MODE: local
      - name: Commit lockfile update when needed
        run: |
          if git diff --quiet -- pilot/package.json pilot/package-lock.json; then
            echo "Already on the pinned security release."
            exit 0
          fi
          git config user.name "staymotion-ci"
          git config user.email "staymotion-ci@users.noreply.github.com"
          git add pilot/package.json pilot/package-lock.json
          git commit -m "security: upgrade Next.js to 15.5.24"
          git push origin HEAD:gpt/phase3-real-pilot-hardening
