<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StayMotion — Salg</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f4f1;--ink:#151619;--muted:#70737b;--line:#d9dad6;--blue:#1248ff;--dark:#111216;--f:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:var(--f);color:var(--ink)}.gate{max-width:400px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;text-align:center;box-shadow:0 24px 70px -45px #000}.brand{font-size:13px;font-weight:800;letter-spacing:.16em}.gate h1{margin:18px 0 6px;font-size:28px}.gate p{color:var(--muted);font-size:14px}.gate input{width:100%;padding:12px 14px;border:1px solid #cfd0cc;border-radius:10px;font-size:15px;margin:12px 0}.gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.err{color:#b83c31;font-size:13px;min-height:20px;margin-top:10px}.app{height:100%;display:flex;flex-direction:column}.hide{display:none!important}.bar{height:66px;flex:none;background:rgba(244,244,241,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;backdrop-filter:blur(16px)}.bar .brand{margin-right:10px}.tab{border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:650;color:#5e6168;cursor:pointer}.tab:hover{background:#fff;border-color:var(--line);color:var(--ink)}.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}.count{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:999px;background:#ecece8;color:#5f6269;font-size:11px;margin-left:5px}.tab.on .count{background:#ffffff20;color:#fff}.sp{flex:1}.hint{font-size:12px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:13px;cursor:pointer}.frame{width:100%;height:calc(100vh - 66px);border:0;background:var(--bg);display:block}@media(max-width:640px){.bar{height:auto;min-height:66px;flex-wrap:wrap;padding:10px 12px}.bar .brand{width:100%}.hint{display:none}.frame{height:calc(100vh - 104px)}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="brand">STAYMOTION</div>
  <h1>Salgssystem</h1>
  <p>Research først. CRM etter godkjenning.</p>
  <input id="key" type="password" placeholder="Adminnøkkel" autocomplete="current-password">
  <button id="enter">Lås opp →</button>
  <div id="err" class="err"></div>
</div>
<div id="app" class="app hide">
  <div class="bar">
    <div class="brand">STAYMOTION</div>
    <button class="tab on" id="tab-research">Research <span class="count">22</span></button>
    <button class="tab" id="tab-crm">CRM / Leads <span class="count" id="lead-count">0</span></button>
    <div class="sp"></div>
    <span class="hint">Bare godkjente kandidater flyttes til CRM</span>
    <button class="logout" id="logout">Logg ut</button>
  </div>
  <iframe class="frame" id="frame" src="about:blank" title="StayMotion salg"></iframe>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);let KEY='';
async function api(path){const u='/api/'+path+'?key='+encodeURIComponent(KEY)+'&_='+Date.now();const r=await fetch(u,{cache:'no-store',headers:{'x-admin-key':KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function enter(){KEY=$('key').value.trim();if(!KEY)return;$('err').textContent='';try{await api('sales-config');sessionStorage.setItem('sm_admin',KEY);$('gate').classList.add('hide');$('app').classList.remove('hide');await refreshCount();show('research')}catch(e){$('err').textContent=e.message||'Feil nøkkel'}}
async function refreshCount(){try{const d=await api('admin-leads');$('lead-count').textContent=(d.leads||[]).length}catch(e){$('lead-count').textContent='—'}}
function show(which){const research=which==='research';$('tab-research').classList.toggle('on',research);$('tab-crm').classList.toggle('on',!research);$('frame').src=research?'/research.html':'/salg.html';setTimeout(refreshCount,800)}
$('enter').onclick=enter;$('key').onkeydown=e=>{if(e.key==='Enter')enter()};$('tab-research').onclick=()=>show('research');$('tab-crm').onclick=()=>show('crm');$('logout').onclick=()=>{sessionStorage.removeItem('sm_admin');location.reload()};
try{const k=sessionStorage.getItem('sm_admin');if(k){$('key').value=k;enter()}}catch(e){}
</script>
</body>
</html>
