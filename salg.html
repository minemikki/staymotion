<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StayMotion — Salg</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f5f2;--ink:#151619;--muted:#6f7279;--line:#dbdcd8;--blue:#1248ff;--dark:#111216;--red:#b83c31;--f:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:var(--f);color:var(--ink)}.hide{display:none!important}.gate{max-width:400px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;text-align:center;box-shadow:0 24px 70px -45px #000}.brand{font-size:13px;font-weight:800;letter-spacing:.16em}.gate h1{margin:18px 0 6px;font-size:28px}.gate p{color:var(--muted);font-size:14px}.gate input{width:100%;padding:12px 14px;border:1px solid #cfd0cc;border-radius:10px;font-size:15px;margin:12px 0}.gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}.app{height:100%;display:flex;flex-direction:column}.bar{height:68px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(245,245,242,.97);backdrop-filter:blur(16px)}.bar .brand{margin-right:12px}.tab{border:1px solid transparent;background:transparent;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;color:#5f6269;cursor:pointer}.tab:hover{background:#fff;border-color:var(--line);color:var(--ink)}.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}.count{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:999px;background:#e8e8e4;color:#62656c;font-size:11px;margin-left:5px}.tab.on .count{background:#ffffff22;color:#fff}.sp{flex:1}.note{font-size:12px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:13px;cursor:pointer}.stage{position:relative;flex:1;min-height:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;opacity:0;pointer-events:none}.frame.on{visibility:visible;opacity:1;pointer-events:auto}@media(max-width:640px){.bar{height:auto;min-height:68px;flex-wrap:wrap;padding:10px 12px}.bar .brand{width:100%;margin:0}.note{display:none}.stage{min-height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="brand">STAYMOTION</div>
  <h1>Salgssystem</h1>
  <p>Én innlogging for Research og CRM.</p>
  <input id="key" type="password" placeholder="Adminnøkkel" autocomplete="current-password">
  <button id="enter">Lås opp →</button>
  <div id="err" class="err"></div>
</div>
<div id="app" class="app hide">
  <div class="bar">
    <div class="brand">STAYMOTION</div>
    <button class="tab on" id="tab-research">Research <span class="count" id="research-count">20</span></button>
    <button class="tab" id="tab-crm">CRM / Leads</button>
    <div class="sp"></div>
    <div class="note">Research først · behandlet arkiveres · CRM etter godkjenning</div>
    <button class="logout" id="logout">Logg ut</button>
  </div>
  <div class="stage">
    <iframe id="frame-research" class="frame on" title="Research"></iframe>
    <iframe id="frame-crm" class="frame" title="CRM"></iframe>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);let KEY='',loaded=false,CONFIG={},TREATED=new Set(['rore','bjergabygg']);
async function api(path,opts={}){const u='/api/'+path+'?key='+encodeURIComponent(KEY)+'&_='+Date.now();opts.cache='no-store';opts.headers=opts.headers||{};opts.headers['x-admin-key']=KEY;const r=await fetch(u,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function post(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
function updateResearchCount(total=22){$('research-count').textContent=Math.max(0,total-TREATED.size)}
function loadFrames(){if(loaded)return;loaded=true;$('frame-research').src='/research.html';$('frame-crm').src='/salg-crm.html';}
async function enter(){KEY=$('key').value.trim();if(!KEY)return;$('err').textContent='';try{const d=await api('sales-config');CONFIG=d.config||{};TREATED=new Set(Array.isArray(CONFIG.researchTreatedIds)?CONFIG.researchTreatedIds:['rore','bjergabygg']);updateResearchCount();sessionStorage.setItem('sm_admin',KEY);$('gate').classList.add('hide');$('app').classList.remove('hide');loadFrames();}catch(e){$('err').textContent=e.message||'Feil nøkkel'}}
function show(which){const research=which==='research';$('tab-research').classList.toggle('on',research);$('tab-crm').classList.toggle('on',!research);$('frame-research').classList.toggle('on',research);$('frame-crm').classList.toggle('on',!research)}
async function saveTreated(id,treated){const before=new Set(TREATED);if(treated)TREATED.add(id);else TREATED.delete(id);updateResearchCount();try{const d=await post('sales-config',{patch:{researchTreatedIds:[...TREATED]}});CONFIG=d.config||CONFIG;return true}catch(e){TREATED=before;updateResearchCount();alert('Kunne ikke lagre Behandlet-status: '+e.message);return false}}
function enhanceResearch(){const fr=$('frame-research'),w=fr.contentWindow,d=fr.contentDocument;if(!w||!d||!Array.isArray(w.C)||typeof w.render!=='function'){setTimeout(enhanceResearch,100);return}if(w.__smTreatedEnhanced){w.render();return}w.__smTreatedEnhanced=true;
  const style=d.createElement('style');style.textContent='#sm-status-tabs{display:flex;gap:8px;align-items:center;margin:18px 0 8px}.sm-state-btn{border:1px solid #cfd0cc;background:#fff;color:#5f6269;padding:9px 13px;border-radius:999px;font:600 13px var(--f);cursor:pointer}.sm-state-btn.on{background:#16171a;color:#fff;border-color:#16171a}.sm-state-btn b{margin-left:5px}.tag.treated{background:#e9f5ee;color:#15734a;border:1px solid #bfe0cd}.btn.treated-action{margin-left:auto}';d.head.appendChild(style);
  const filter=d.getElementById('filter');if(filter){const all=filter.querySelector('option[value="all"]');if(all)all.textContent='Aktive';if(!filter.querySelector('option[value="treated"]')){const o=d.createElement('option');o.value='treated';o.textContent='Behandlet';filter.appendChild(o)}filter.value='all'}
  const tools=d.querySelector('.tools');if(tools&&!d.getElementById('sm-status-tabs')){const tabs=d.createElement('div');tabs.id='sm-status-tabs';tabs.innerHTML='<button class="sm-state-btn on" id="sm-active">Aktive <b id="sm-active-count">0</b></button><button class="sm-state-btn" id="sm-treated">Behandlet <b id="sm-treated-count">0</b></button>';tools.parentNode.insertBefore(tabs,tools);d.getElementById('sm-active').onclick=()=>{filter.value='all';w.render()};d.getElementById('sm-treated').onclick=()=>{filter.value='treated';w.render()}}
  const originalRender=w.render.bind(w);w.render=function(){const full=w.C,f=filter?filter.value:'all',doneView=f==='treated';w.C=full.filter(c=>doneView?TREATED.has(c.id):!TREATED.has(c.id));try{originalRender()}finally{w.C=full}decorateResearch(w,d,full,f)};
  if(typeof w.promote==='function'){const originalPromote=w.promote.bind(w);w.promote=async function(id,btn){await originalPromote(id,btn);if(w.PROMOTED&&w.PROMOTED.has(id)){await saveTreated(id,true);w.render()}}}
  w.render();
}
function decorateResearch(w,d,full,filterValue){const active=full.filter(c=>!TREATED.has(c.id)).length,done=full.filter(c=>TREATED.has(c.id)).length;updateResearchCount(full.length);const a=d.getElementById('sm-active-count'),b=d.getElementById('sm-treated-count');if(a)a.textContent=active;if(b)b.textContent=done;const ab=d.getElementById('sm-active'),tb=d.getElementById('sm-treated');if(ab)ab.classList.toggle('on',filterValue!=='treated');if(tb)tb.classList.toggle('on',filterValue==='treated');const sAll=d.getElementById('sAll');if(sAll){sAll.textContent=active;if(sAll.nextElementSibling)sAll.nextElementSibling.textContent='Aktive kandidater'}const sReviewed=d.getElementById('sReviewed');if(sReviewed)sReviewed.textContent=full.filter(c=>c.state==='reviewed'&&!TREATED.has(c.id)).length;const sRes=d.getElementById('sResearched');if(sRes&&w.RESULTS)sRes.textContent=Object.keys(w.RESULTS).filter(id=>!TREATED.has(id)).length;
  d.querySelectorAll('[data-card]').forEach(card=>{const id=card.getAttribute('data-card'),isDone=TREATED.has(id),co=card.querySelector('.co');if(isDone&&co&&!co.querySelector('.tag.treated')){const tag=d.createElement('span');tag.className='tag treated';tag.textContent='BEHANDLET';co.appendChild(tag)}const actions=card.querySelector('.actions');if(actions&&!actions.querySelector('[data-treated-action]')){const btn=d.createElement('button');btn.className='btn treated-action';btn.setAttribute('data-treated-action',id);btn.textContent=isDone?'↩ Flytt tilbake til aktive':'✓ Marker behandlet';btn.onclick=async()=>{btn.disabled=true;const ok=await saveTreated(id,!isDone);if(ok)w.render();else btn.disabled=false};actions.appendChild(btn)}})}
$('frame-research').addEventListener('load',()=>setTimeout(enhanceResearch,30));$('enter').onclick=enter;$('key').onkeydown=e=>{if(e.key==='Enter')enter()};$('tab-research').onclick=()=>show('research');$('tab-crm').onclick=()=>show('crm');$('logout').onclick=()=>{sessionStorage.removeItem('sm_admin');location.reload()};
try{const k=sessionStorage.getItem('sm_admin');if(k){$('key').value=k;enter()}}catch(e){}
</script>
</body>
</html>
