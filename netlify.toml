# StayMotion — static site (Netlify)
# Pure static HTML: no build step, publish directory is the repo root.
# Serve the single-file site at the site root ("/" -> staymotion.html).

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/"
  to = "/staymotion.html"
  status = 200

# Long-lived, immutable caching for the media (filenames are stable).
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
